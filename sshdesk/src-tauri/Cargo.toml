[package]
name = "sshdesk"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sshdesk-core = { path = "../core" }
portable-pty = "0.9"
tauri-plugin-drag = "2.1.1"
